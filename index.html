<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SLEEPY PLANET AM · 1690</title>
<meta name="description" content="A public station of the imaginal. Tune the band.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0a09'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23e8a33c' stroke-width='1.4'/%3E%3Crect x='15.2' y='4' width='1.6' height='9' fill='%23c8452c'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;1,6..72,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --case:#100e0c; --case2:#191512; --edge:#332b23; --edge2:#4a3f33;
  --glass:#0a0906; --amber:#e8a33c; --hot:#ffd08a; --dim:#7d6a49;
  --faint:#4e422f; --red:#c8452c; --ink:#f2e6cd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:var(--ink);
  font-family:"Space Mono",monospace;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;touch-action:none}

/* ── the room the set sits in ───────────────────────────────── */
#room{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(6px,2vw,28px);
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(232,163,60,.07), transparent 55%),
    radial-gradient(140% 120% at 50% 120%, rgba(0,0,0,.9), transparent 60%),
    #060504}

/* ── the chassis ────────────────────────────────────────────── */
#set{width:min(1060px,100%);height:min(720px,100%);position:relative;
  display:grid;grid-template-rows:auto 1fr auto;gap:0;
  border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#1d1815 0%,#141110 40%,#0d0b0a 100%);
  box-shadow:
    0 0 0 1px #241e19,
    0 0 0 5px #0d0b09,
    0 1px 0 5px #2c251e,
    0 40px 90px -40px #000,
    inset 0 1px 0 rgba(255,225,180,.16),
    inset 0 22px 34px -30px rgba(255,210,150,.22);
}
/* brushed metal grain */
#set::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}

/* ── nameplate ──────────────────────────────────────────────── */
.plate{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:clamp(9px,1.6vw,15px) clamp(12px,2.4vw,24px);
  border-bottom:1px solid #221c17;flex-wrap:wrap;
  background:linear-gradient(180deg,#211b17,#171310)}
.mark{display:flex;align-items:baseline;gap:11px;min-width:0}
.mark b{font-weight:700;font-size:clamp(10px,1.5vw,13px);letter-spacing:.34em;
  color:#d8c9ab;text-shadow:0 1px 0 #000}
.mark s{text-decoration:none;font-size:9px;letter-spacing:.22em;color:var(--faint)}
.lamp{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.lamp i{width:8px;height:8px;border-radius:50%;background:#2a211a;
  box-shadow:inset 0 1px 2px #000;transition:all .4s}
.lamp.live i{background:var(--red);box-shadow:0 0 12px var(--red),0 0 26px rgba(200,69,44,.5)}
.lamp.live{color:#e8b28c}

/* ── the glass ──────────────────────────────────────────────── */
#glass{position:relative;overflow:hidden;background:var(--glass);
  border-top:1px solid #000;border-bottom:1px solid #000;
  box-shadow:inset 0 12px 34px -12px #000, inset 0 -14px 34px -12px #000}
#glass.off .lit{opacity:0}
.lit{transition:opacity .55s ease}

/* dial scale across the top of the glass */
#dialwrap{position:absolute;left:0;right:0;top:0;height:clamp(74px,13vh,104px);
  border-bottom:1px solid rgba(232,163,60,.14);cursor:ew-resize}
#dial{display:block;width:100%;height:100%}
#hair{position:absolute;left:50%;top:5px;bottom:5px;width:1px;margin-left:-.5px;
  background:linear-gradient(180deg,transparent,var(--red) 12%,var(--red) 88%,transparent);
  box-shadow:0 0 9px rgba(200,69,44,.85);pointer-events:none}
#hair::after{content:"";position:absolute;left:-3.5px;top:-1px;width:8px;height:8px;
  border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}

/* the readout window */
#win{position:absolute;left:0;right:0;top:clamp(74px,13vh,104px);bottom:0;
  padding:clamp(14px,2.6vw,26px) clamp(16px,3.4vw,40px);overflow:hidden}
#winScroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;
  scrollbar-width:thin;scrollbar-color:#3a2f22 transparent}
#winScroll::-webkit-scrollbar{width:5px}
#winScroll::-webkit-scrollbar-thumb{background:#3a2f22;border-radius:3px}

/* scanline + phosphor bloom over everything on the glass */
#glass::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px),
    radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(0,0,0,.6) 100%)}

/* content typography on the glass */
.kick{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
  margin-bottom:clamp(8px,1.4vw,14px)}
.big{font-family:"Newsreader",Georgia,serif;font-weight:200;
  font-size:clamp(1.5rem,4.6vw,3rem);line-height:1.04;letter-spacing:-.015em;
  color:var(--hot);text-shadow:0 0 26px rgba(255,208,138,.28);margin:0 0 .4em}
.big em{font-style:italic;color:var(--amber)}
.say{font-family:"Newsreader",Georgia,serif;font-size:clamp(.98rem,2.1vw,1.16rem);
  line-height:1.66;color:#cbb894;max-width:38em;margin:0 0 .95em}
.say em{font-style:italic;color:var(--ink)}
.tiny{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  line-height:2}
ol.rules{margin:0;padding-left:1.4em;font-family:"Newsreader",Georgia,serif;
  color:#cbb894;line-height:1.7;font-size:clamp(.96rem,2vw,1.08rem)}
ol.rules li{margin-bottom:.7em}
ol.rules b{color:var(--hot);font-weight:400;font-style:italic}
.grid13{display:flex;gap:5px;margin-top:clamp(10px,2vw,18px);align-items:stretch}
.cell{flex:1 1 0;min-width:0;border:1px solid rgba(232,163,60,.14);border-radius:2px;
  padding:9px 5px;height:clamp(70px,11vh,104px);display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;background:rgba(232,163,60,.015)}
.cell u{text-decoration:none;font-size:9px;letter-spacing:.1em;color:var(--faint)}
.cell span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Newsreader",serif;
  font-style:italic;font-size:.66rem;color:#4b3f2c;line-height:1;white-space:nowrap;
  overflow:hidden;max-height:100%}
.cell.on{border-color:rgba(232,163,60,.55);background:rgba(232,163,60,.07)}
.cell.on u{color:var(--amber)} .cell.on span{color:var(--hot)}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--glass);background:var(--amber);border-radius:999px;padding:9px 15px;
  margin-top:12px;cursor:pointer;border:none;font-family:inherit}
.pill:hover{background:var(--hot)}
.pill.o{background:transparent;color:var(--amber);border:1px solid rgba(232,163,60,.45)}
.pill.o:hover{background:rgba(232,163,60,.12);color:var(--hot)}

#ghost{position:absolute;z-index:4;font-family:"Newsreader",Georgia,serif;font-style:italic;
  font-size:clamp(1.1rem,3.2vw,1.9rem);color:var(--amber);opacity:0;pointer-events:none;
  transition:opacity .5s ease;text-shadow:0 0 24px rgba(232,163,60,.5);max-width:60%}

/* static wash when off-station */
#hiss{position:absolute;inset:clamp(74px,13vh,104px) 0 0 0;pointer-events:none;z-index:5;
  opacity:0;transition:opacity .25s}
#hiss canvas{width:100%;height:100%;display:block}

/* ── the deck ───────────────────────────────────────────────── */
.grille{position:absolute;inset:0;width:100%;height:100%;opacity:.85;pointer-events:none}
.scr{position:absolute;width:15px;height:15px;opacity:.75;pointer-events:none}
.scr.tl{left:9px;top:9px} .scr.tr{right:9px;top:9px}
.logo{width:17px;height:17px;flex:0 0 auto;opacity:.9;transform:translateY(2px)}
.deck{position:relative;display:flex;align-items:center;gap:clamp(10px,2.4vw,26px);
  padding:clamp(10px,1.8vw,18px) clamp(12px,2.6vw,26px);
  border-top:1px solid #221c17;background:#0e0c0a;
  flex-wrap:nowrap;overflow:hidden}
.deck > *:not(.grille):not(.scr){position:relative;z-index:2}
.knob{width:clamp(58px,9.2vw,88px);height:clamp(58px,9.2vw,88px);flex:0 0 auto;
  border-radius:50%;cursor:grab;position:relative;
  filter:drop-shadow(0 4px 9px rgba(0,0,0,.85))}
.knob:active{cursor:grabbing}
.knob svg{position:absolute;inset:0;width:100%;height:100%}
.klabel{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  text-align:center;margin-top:5px;white-space:nowrap}
.kwrap{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}

.readout{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.khz{font-size:clamp(1.4rem,4.6vw,2.5rem);line-height:1;color:var(--hot);letter-spacing:.04em;
  text-shadow:0 0 22px rgba(255,208,138,.4)}
.khz small{font-size:.34em;letter-spacing:.24em;color:var(--dim);margin-left:7px}
.state{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);
  transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state.on{color:var(--hot)}

.meter{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px}
.bars i{width:5px;background:#2a2119;border-radius:1px;transition:background .12s,height .12s}
.bars i.lit{background:var(--amber);box-shadow:0 0 7px rgba(232,163,60,.7)}

.sw{flex:0 0 auto;width:clamp(40px,6vw,54px);height:clamp(22px,3.4vw,28px);border-radius:999px;
  background:#0c0a09;box-shadow:inset 0 2px 6px #000,0 1px 0 rgba(255,220,170,.06);
  position:relative;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;bottom:3px;width:44%;border-radius:999px;
  background:linear-gradient(180deg,#4a4038,#241e19);transition:left .22s cubic-bezier(.3,1.4,.4,1)}
.sw.on i{left:53%;background:linear-gradient(180deg,#e8a33c,#a86f22);box-shadow:0 0 14px rgba(232,163,60,.6)}

#nudge{position:absolute;left:50%;bottom:clamp(14px,3vh,26px);transform:translateX(-50%);
  z-index:30;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);
  opacity:0;transition:opacity 1s ease;pointer-events:none;white-space:nowrap}

/* ── boot veil ──────────────────────────────────────────────── */
#veil{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;background:#0a0908;cursor:pointer;
  transition:opacity .8s ease}
#veil.gone{opacity:0;pointer-events:none}
#veil .t{font-family:"Newsreader",serif;font-style:italic;font-weight:200;
  font-size:clamp(1.3rem,4.4vw,2.2rem);color:var(--amber)}
#veil .s{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}

@media (max-width:720px){
  .deck{gap:10px;padding:10px 12px}
  .meter{display:none}
  #set{height:100%;border-radius:6px}
  #win{display:flex;align-items:center}
  #winScroll{max-height:100%}
  .big{font-size:clamp(1.5rem,7vw,2.2rem)}
  .grid13{gap:3px}
  .cell{padding:7px 3px;height:64px}
  .cell span{font-size:.58rem}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- knurled knob: a milled rim of 44 teeth, a domed cap, a lit edge -->
  <radialGradient id="cap" cx="34%" cy="26%">
    <stop offset="0%" stop-color="#4b4038"/><stop offset="58%" stop-color="#221c18"/>
    <stop offset="100%" stop-color="#0d0b09"/>
  </radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5d5045"/><stop offset="52%" stop-color="#191411"/>
    <stop offset="100%" stop-color="#332a23"/>
  </linearGradient>
  <g id="knurl">
    <circle cx="50" cy="50" r="48" fill="url(#rim)"/>
    <g id="teeth" stroke="#0b0908" stroke-width="1.5" opacity=".85"></g>
    <circle cx="50" cy="50" r="40" fill="url(#cap)"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,220,170,.13)" stroke-width="1"/>
    <ellipse cx="38" cy="32" rx="17" ry="11" fill="rgba(255,235,205,.055)"/>
  </g>
  <g id="ptr"><rect x="47.6" y="10" width="4.8" height="24" rx="2.4"/></g>

  <!-- perforated speaker cloth: hole grid on a dark weave -->
  <pattern id="perf" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#1a1512"/>
    <circle cx="2.6" cy="2.6" r="1.55" fill="#050404"/>
    <circle cx="2.6" cy="2.6" r="1.55" fill="none" stroke="rgba(255,220,170,.11)" stroke-width=".6"/>
    <circle cx="7.1" cy="7.1" r="1.55" fill="#050404"/>
    <circle cx="7.1" cy="7.1" r="1.55" fill="none" stroke="rgba(255,220,170,.11)" stroke-width=".6"/>
  </pattern>

  <!-- a slotted screw, four of them hold the chassis on -->
  <g id="screw">
    <circle cx="9" cy="9" r="8" fill="#191512"/>
    <circle cx="9" cy="9" r="7" fill="url(#cap)"/>
    <rect x="3.6" y="8.1" width="10.8" height="1.9" rx=".9" fill="#080706"/>
    <circle cx="9" cy="9" r="7.4" fill="none" stroke="rgba(255,220,170,.10)" stroke-width=".8"/>
  </g>

  <!-- the mark: a point, and what leaves it -->
  <g id="mark">
    <circle cx="16" cy="16" r="2.3" fill="#e8a33c"/>
    <path d="M16 16 m-6.4 0 a6.4 6.4 0 0 1 12.8 0" fill="none" stroke="#e8a33c" stroke-width="1.5" opacity=".85"/>
    <path d="M16 16 m-10.6 0 a10.6 10.6 0 0 1 21.2 0" fill="none" stroke="#e8a33c" stroke-width="1.3" opacity=".5"/>
    <path d="M16 16 m-14.6 0 a14.6 14.6 0 0 1 29.2 0" fill="none" stroke="#e8a33c" stroke-width="1.1" opacity=".24"/>
  </g>
</defs></svg>

<div id="room">
<div id="set">

  <div class="plate">
    <div class="mark"><svg class="logo" viewBox="0 0 32 32"><use href="#mark"/></svg>
      <b>SLEEPY&nbsp;PLANET&nbsp;AM</b><s>1690 kHz &middot; salt lake</s></div>
    <div class="lamp" id="lamp"><i></i><span id="lampTxt">sun · 22:00 mt</span></div>
  </div>

  <div id="glass" class="off">
    <div id="dialwrap"><canvas id="dial"></canvas><div id="hair"></div></div>
    <div id="hiss"><canvas id="hisscv"></canvas></div>
    <div id="win"><div id="winScroll" class="lit"></div></div>
  </div>

  <div class="deck">
    <svg class="grille" aria-hidden="true"><rect width="100%" height="100%" fill="url(#perf)"/></svg>
    <svg class="scr tl" viewBox="0 0 18 18"><use href="#screw"/></svg>
    <svg class="scr tr" viewBox="0 0 18 18"><use href="#screw"/></svg>
    <div class="sw" id="power" title="power"><i></i></div>
    <div class="readout">
      <div class="khz" id="khz">1690<small>kHz</small></div>
      <div class="state" id="state">off</div>
    </div>
    <div class="meter">
      <div class="bars" id="bars"></div>
      <div class="klabel">signal</div>
    </div>
    <div class="kwrap">
      <div class="knob" id="vol"><svg viewBox="0 0 100 100"><use href="#knurl"/><g id="volg"><use href="#ptr" fill="#e8a33c"/></g></svg></div>
      <div class="klabel">vol</div>
    </div>
    <div class="kwrap">
      <div class="knob" id="tune"><svg viewBox="0 0 100 100"><use href="#knurl"/><g id="tuneg"><use href="#ptr" fill="#c8452c"/></g></svg></div>
      <div class="klabel">tune</div>
    </div>
  </div>

  <div id="nudge">turn the dial</div>
  <div id="veil">
    <div class="t">Sleepy Planet AM</div>
    <div class="s">switch on</div>
  </div>

</div>
</div>

<script>
/* ============================================================================
   SLEEPY PLANET AM — a receiver, not a website

   The band is the navigation. There is no scrolling page and no menu: you turn
   the dial and pass through hiss until a carrier stands up, and whatever that
   station carries appears on the glass. Six carriers on the band, one of them
   unmarked.

   The audio is synthesised on the spot — filtered noise whose bandwidth and
   level track how far off you are, mains hum under a locked carrier, and the
   heterodyne whistle that sweeps as you cross a station, which is the detail
   that makes an AM set sound like an AM set. No files, nothing loaded.
   ========================================================================= */

var LO=1600, HI=1720, WINDOW=34;      /* kHz visible across the dial */
var locked=false;   /* schmitt trigger: catches at .58, lets go at .44 */
var freq=1657.0, power=false, vol=0.65;

var STATIONS=[
 {f:1690, id:"the station", body:function(){ return ''
    +'<div class="kick">carrier &middot; 1690 khz</div>'
    +'<h1 class="big">A public station<br>of the <em>imaginal</em>.</h1>'
    +'<p class="say">People who join us, people who write in, people who we imagined.</p>'
    +'<p class="say">Every broadcast is one real session. Somebody is guided into a place '
    +'that does not exist, they describe what they find, and the tape runs. Twenty minutes: '
    +'two from the Keeper, then the passage, then what they carried out. Nothing here is acted.</p>'
    +'<p class="tiny">1666 the charter &nbsp;·&nbsp; 1702 the season &nbsp;·&nbsp; '
    +'1638 correspondence &nbsp;·&nbsp; 1719 &mdash;</p>';
  }},
 {f:1702, id:"the season", body:function(){
    var g=''; for(var i=1;i<=13;i++){ var on=(i===1);
      g+='<div class="cell'+(on?' on':'')+'"><span>'
        +(on?'offered':'&mdash;')+'</span><u>'+String(i).padStart(2,"0")+'</u></div>'; }
    return ''
    +'<div class="kick">1702 khz &middot; programme one</div>'
    +'<h1 class="big"><em>Field Recordings</em><br>from Nowhere</h1>'
    +'<p class="say">Thirteen broadcasts, Sundays at ten Mountain. Then the programme is '
    +'boxed and the next takes a different form. A station that never ends is a feed.</p>'
    +'<div class="grid13">'+g+'</div>'+'<p class="tiny" style="margin-top:14px">one offered &middot; twelve unrecorded</p>';
  }},
 {f:1666, id:"the charter", body:function(){ return ''
    +'<div class="kick">1666 khz &middot; standing orders</div>'
    +'<h1 class="big">The charter</h1>'
    +'<ol class="rules">'
    +'<li><b>The recording is the material.</b> If a broadcast could have been written in advance it does not air.</li>'
    +'<li><b>Consent runs backwards.</b> The traveller hears the cut and says yes before it goes out. Authorising the transmission is part of coming back.</li>'
    +'<li><b>One question, then real silence.</b> Long enough that an answer forms whether or not it is spoken.</li>'
    +'<li><b>The advertisements are part of the story.</b> They always were.</li>'
    +'<li><b>Thirteen and then boxed.</b> Each programme runs its length, becomes an object, and the next takes a different form.</li>'
    +'<li><b>An appointed hour.</b> Repetition at a set time is the difference between a station and a library.</li>'
    +'<li><b>Nothing gets fixed in the edit.</b> The hesitation is the evidence it was real.</li>'
    +'</ol>'
    +'<p class="say" style="margin-top:1.2em">1690 kHz is unlicensed and legal at very low power, '
    +'covering about one block of Salt Lake City. Almost nobody will hear it that way. It matters '
    +'that the carrier is real air.</p>';
  }},
 {f:1638, id:"correspondence", body:function(){ return ''
    +'<div class="kick">1638 khz &middot; transmit back</div>'
    +'<h1 class="big">Three ways in</h1>'
    +'<p class="say"><em>Listen.</em> Be there at the hour. The silence after the question is your part; there is nothing to press.</p>'
    +'<p class="say"><em>Write in.</em> A voice memo or a few lines. Some are read on the air in the sender&rsquo;s own words.</p>'
    +'<p class="say"><em>Come in.</em> Ask for a passage. Ninety minutes, nothing to prepare, nothing to get right. Some become broadcasts, and only with your say-so after you have heard the cut.</p>'
    +'<a class="pill" href="mailto:hello@sleepyplanet.studio?subject=SPAM%20%E2%80%94%20what%20I%20saw">Write in</a> '
    +'<a class="pill o" href="mailto:hello@sleepyplanet.studio?subject=SPAM%20%E2%80%94%20a%20passage">Ask for a passage</a>';
  }},
 {f:1719, id:"—", body:function(){
    var lines=["The door you did not take is still open.",
               "Somebody wrote in about a room with no floor. We have not replied.",
               "There is a frequency below this one that only works in the rain.",
               "You were here before. The log says so.",
               "Nothing is scheduled. Come back at the hour."];
    var i=Math.floor(Math.random()*lines.length);
    return '<div class="kick">1719 khz &middot; unmarked</div>'
      +'<h1 class="big" style="font-size:clamp(1.3rem,3.6vw,2.2rem)"><em>'+lines[i]+'</em></h1>'
      +'<p class="tiny">tune away and back for another</p>';
  }},
 {f:1612, id:"station id", body:function(){ return ''
    +'<div class="kick">1612 khz &middot; identification</div>'
    +'<h1 class="big">SPAM</h1>'
    +'<p class="say">Broadcasts from somewhere, sent to nowhere, picked up from anywhere.</p>'
    +'<p class="tiny">surrealist realist imagination &middot; signalform &middot; salt lake city</p>';
  }}
];

/* ── audio ──────────────────────────────────────────────────── */
var AC=null, noiseSrc, bp, noiseGain, humOsc, humGain, hetOsc, hetGain, master;
function audioUp(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);

  /* two seconds of white noise, looped, pushed through a bandpass that opens
     and closes with how far off station you are */
  var n=AC.sampleRate*2, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  noiseSrc=AC.createBufferSource(); noiseSrc.buffer=buf; noiseSrc.loop=true;
  bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1400; bp.Q.value=0.7;
  noiseGain=AC.createGain(); noiseGain.gain.value=0.16;
  noiseSrc.connect(bp); bp.connect(noiseGain); noiseGain.connect(master);
  noiseSrc.start();

  /* mains hum, only audible once a carrier is locked */
  humOsc=AC.createOscillator(); humOsc.type="sine"; humOsc.frequency.value=60;
  humGain=AC.createGain(); humGain.gain.value=0;
  humOsc.connect(humGain); humGain.connect(master); humOsc.start();

  /* the heterodyne whistle: sweeps down as you close on a carrier */
  hetOsc=AC.createOscillator(); hetOsc.type="sine"; hetOsc.frequency.value=2000;
  hetGain=AC.createGain(); hetGain.gain.value=0;
  hetOsc.connect(hetGain); hetGain.connect(master); hetOsc.start();
}
function click(){
  if(!AC) return;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type="square"; o.frequency.value=120;
  g.gain.setValueAtTime(0.12,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.05);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+0.07);
}

/* ── station maths ──────────────────────────────────────────── */
function nearest(){
  var best=STATIONS[0], bd=1e9;
  for(var i=0;i<STATIONS.length;i++){ var d=Math.abs(freq-STATIONS[i].f);
    if(d<bd){ bd=d; best=STATIONS[i]; } }
  return {st:best, d:bd};
}
function strength(){ var n=nearest(); return Math.max(0,1-n.d/5.0); }   /* 0..1 */

/* ── the dial face ──────────────────────────────────────────── */
var dial=document.getElementById("dial"), dctx=dial.getContext("2d");
var hisscv=document.getElementById("hisscv"), hctx=hisscv.getContext("2d");
var hissEl=document.getElementById("hiss");
function fit(c){ var r=c.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1);
  c.width=Math.max(1,r.width*d); c.height=Math.max(1,r.height*d);
  c.getContext("2d").setTransform(d,0,0,d,0,0); return r; }
function sizeAll(){ fit(dial); fit(hisscv); }
addEventListener("resize",sizeAll);

var T=0;
function drawDial(){
  var r=dial.getBoundingClientRect(), W=r.width, H=r.height;
  dctx.clearRect(0,0,W,H);
  if(!power){ return; }
  var left=freq-WINDOW/2;

  /* backlight behind the glass */
  var flick = warm<1 ? (0.35+0.65*warm)*(0.82+0.18*Math.sin(T*47)) : 1;
  var g=dctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"rgba(232,163,60,"+(0.10*flick)+")"); g.addColorStop(1,"rgba(232,163,60,"+(0.02*flick)+")");
  dctx.fillStyle=g; dctx.fillRect(0,0,W,H);

  /* ticks */
  dctx.font='9px "Space Mono", monospace'; dctx.textAlign="center";
  for(var f=Math.ceil(left); f<left+WINDOW; f++){
    var x=(f-left)/WINDOW*W;
    var five=(f%5===0), ten=(f%10===0);
    if(!five && WINDOW>28) continue;
    dctx.strokeStyle= ten?"rgba(232,163,60,.62)":(five?"rgba(232,163,60,.30)":"rgba(232,163,60,.14)");
    dctx.lineWidth=1;
    dctx.beginPath(); dctx.moveTo(x,H-16); dctx.lineTo(x,H-16-(ten?15:8)); dctx.stroke();
    if(ten){ dctx.fillStyle="rgba(200,178,133,.75)"; dctx.fillText(String(f),x,H-4); }
  }

  /* the stations, printed on the glass like a real dial */
  for(var i=0;i<STATIONS.length;i++){
    var s=STATIONS[i], x2=(s.f-left)/WINDOW*W;
    if(x2<-60||x2>W+60) continue;
    var close=Math.max(0,1-Math.abs(freq-s.f)/5);
    dctx.fillStyle="rgba(255,208,138,"+(0.30+0.7*close)+")";
    dctx.font='9px "Space Mono", monospace';
    dctx.fillText(s.id.toUpperCase(), x2, 15);
    dctx.strokeStyle="rgba(255,208,138,"+(0.25+0.75*close)+")";
    dctx.lineWidth= close>0.7 ? 2 : 1;
    dctx.beginPath(); dctx.moveTo(x2,20); dctx.lineTo(x2,H-30); dctx.stroke();
  }

  /* the spectrum trace along the bottom */
  dctx.beginPath();
  for(var x3=0;x3<W;x3+=2){
    var fx=left+x3/W*WINDOW, peak=0;
    for(var k=0;k<STATIONS.length;k++){
      var dd=fx-STATIONS[k].f;
      peak=Math.max(peak, Math.exp(-(dd*dd)/1.6));
    }
    var hiss=(Math.random()-0.5)*(0.30-0.22*strength());
    var y=H-16 - (peak*(H*0.42) + hiss*(H*0.24) + Math.sin(fx*3+T*4)*peak*3);
    if(x3===0) dctx.moveTo(x3,y); else dctx.lineTo(x3,y);
  }
  dctx.strokeStyle="rgba(232,163,60,"+(0.42+0.42*strength())+")";
  dctx.lineWidth=1; dctx.stroke();
}

var grainBuf=null, grainCtx=null, grainImg=null;
function drawHiss(){
  var r=hisscv.getBoundingClientRect(), W=r.width, H=r.height;
  var s=strength();
  hissEl.style.opacity = power ? String(Math.max(0,(1-s))) : "0";
  if(!power || s>0.96){ hctx.clearRect(0,0,W,H); return; }
  /* grain is generated at a quarter scale and blown up — cheaper, and the
     bigger speckle reads more like an actual off-station screen */
  var gw=Math.max(2,Math.round(W/4)), gh=Math.max(2,Math.round(H/4));
  if(!grainBuf || grainBuf.width!==gw || grainBuf.height!==gh){
    grainBuf=document.createElement("canvas"); grainBuf.width=gw; grainBuf.height=gh;
    grainCtx=grainBuf.getContext("2d"); grainImg=grainCtx.createImageData(gw,gh);
  }
  var d=grainImg.data;
  var a=Math.round(52*(1-s));
  for(var i=0;i<d.length;i+=4){
    var v=Math.random()*255;
    d[i]=v*0.95; d[i+1]=v*0.70; d[i+2]=v*0.36; d[i+3]=a*(Math.random()<0.55?1:0.35);
  }
  grainCtx.putImageData(grainImg,0,0);
  hctx.clearRect(0,0,W,H);
  hctx.imageSmoothingEnabled=true;
  hctx.drawImage(grainBuf,0,0,W,H);
  /* a rolling bar, the way an unlocked signal crawls up the screen */
  var y=((T*0.13)%1.6-0.3)*H;
  var gr=hctx.createLinearGradient(0,y,0,y+H*0.22);
  gr.addColorStop(0,"rgba(232,163,60,0)");
  gr.addColorStop(0.5,"rgba(232,163,60,"+(0.05*(1-s))+")");
  gr.addColorStop(1,"rgba(232,163,60,0)");
  hctx.fillStyle=gr; hctx.fillRect(0,y,W,H*0.22);
}

/* ── bleed-through ──────────────────────────────────────────────
   Adjacent-channel splatter. Off station you catch pieces of whatever is
   closest, drifting and half-legible, which is the reason to keep turning. */
var GHOST=["the door you did not take","people who we imagined","consent runs backwards",
  "thirteen and then boxed","sundays at ten","one question, then real silence",
  "somewhere &middot; nowhere &middot; anywhere","the hesitation is the evidence",
  "not yet transmitted","a place that does not exist"];
var ghostEl=null;
function bleed(){
  if(!ghostEl){ ghostEl=document.createElement("div"); ghostEl.id="ghost";
    document.getElementById("win").appendChild(ghostEl); }
  var s=strength();
  if(!power || s>0.55){ ghostEl.style.opacity="0"; return; }
  var band=Math.max(0,Math.min(1,(0.5-Math.abs(s-0.22))/0.5));
  ghostEl.style.opacity=String(0.10+0.5*band);
  var slot=Math.floor(T*0.55);
  if(bleed.slot!==slot){ bleed.slot=slot;
    ghostEl.innerHTML=GHOST[Math.abs(Math.floor(freq*3)+slot)%GHOST.length];
    ghostEl.style.top=(14+((Math.abs(Math.floor(freq*7))+slot)%56))+"%";
    ghostEl.style.left=(4+((Math.abs(Math.floor(freq*11))+slot*3)%42))+"%"; }
}

/* ── the display ────────────────────────────────────────────── */
var win=document.getElementById("winScroll"), shown=null;
function paint(){
  var n=nearest(), s=strength();
  var glass=document.getElementById("glass");
  if(!power){ locked=false; }
  else if(!locked && s>0.58){ locked=true; }
  else if(locked && s<0.44){ locked=false; }
  glass.classList.toggle("off", !locked || warm<0.55);
  if(power && locked){
    if(shown!==n.st.f){ shown=n.st.f; win.innerHTML=n.st.body(); win.scrollTop=0; }
  } else if(shown!==null && !locked){ shown=null; }
}

/* ── readouts ───────────────────────────────────────────────── */
var khzEl=document.getElementById("khz"), stateEl=document.getElementById("state");
var barsEl=document.getElementById("bars");
(function(){ var h=""; for(var i=0;i<7;i++) h+='<i style="height:'+(9+i*4)+'px"></i>'; barsEl.innerHTML=h; })();
var lostFor=0;
function nudge(dt){
  var el=document.getElementById("nudge");
  if(!power){ lostFor=0; el.style.opacity="0"; return; }
  lostFor = (strength()<0.5) ? lostFor+dt : 0;
  el.style.opacity = lostFor>3.5 ? "0.9" : "0";
}

function readouts(){
  khzEl.innerHTML = (power? String(Math.round(freq)) : "&middot;&middot;&middot;&middot;") + '<small>kHz</small>';
  var s=strength(), n=nearest();
  var lit=Math.round(s*7);
  var kids=barsEl.children;
  for(var i=0;i<kids.length;i++) kids[i].classList.toggle("lit", power && i<lit);
  if(!power){ stateEl.textContent="off"; stateEl.classList.remove("on"); return; }
  if(s>0.82){ stateEl.textContent="locked · "+n.st.id; stateEl.classList.add("on"); }
  else if(s>0.35){ stateEl.textContent="fading in"; stateEl.classList.remove("on"); }
  else { stateEl.textContent="between stations"; stateEl.classList.remove("on"); }
}

/* ── audio follow ───────────────────────────────────────────── */
function audioFollow(){
  if(!AC) return;
  var s=strength(), t=AC.currentTime, on=power?1:0;
  master.gain.setTargetAtTime(on*vol, t, 0.08);
  /* noise narrows and quiets as the carrier comes up */
  bp.frequency.setTargetAtTime(700+2600*(1-s), t, 0.1);
  bp.Q.setTargetAtTime(0.5+3.5*s, t, 0.1);
  noiseGain.gain.setTargetAtTime(0.20*(1-s*0.92), t, 0.08);
  humGain.gain.setTargetAtTime(0.055*Math.max(0,(s-0.5)/0.5), t, 0.12);
  /* the whistle only exists in the approach, and slides down into the carrier */
  var band=Math.max(0, 1-Math.abs(1-s*2.2));
  hetGain.gain.setTargetAtTime(0.03*band, t, 0.06);
  hetOsc.frequency.setTargetAtTime(160+2600*(1-s), t, 0.05);
}

/* ── loop ───────────────────────────────────────────────────── */
var last=null;
function frame(ts){
  var dt=(last===null)?0:Math.min(0.05,(ts-last)/1000); last=ts; T+=dt;
  if(power){ warm=Math.min(1,warm+dt/1.1);
    /* every set drifts. two slow sines, never in phase. */
    freq += (Math.sin(T*0.083)*0.0022 + Math.sin(T*0.031+1.7)*0.0014); }
  paintTune();
  drawDial(); drawHiss(); bleed(); paint(); readouts(); nudge(dt); audioFollow();
  requestAnimationFrame(frame);
}

/* ── knobs and the band ─────────────────────────────────────── */
function px(e){ return (e.touches?e.touches[0]:e).clientX; }
function py(e){ return (e.touches?e.touches[0]:e).clientY; }

function rotary(el, gid, get, set, sens){
  var g=document.getElementById(gid), d=null;
  function paintAngle(){ g.setAttribute("transform","rotate("+(get()*270-135)+" 50 50)"); }
  function down(e){ d={y:py(e),x:px(e),v:get()}; e.stopPropagation(); }
  function move(e){ if(!d)return;
    var dy=(d.y-py(e))+(px(e)-d.x);
    set(Math.max(0,Math.min(1, d.v + dy*sens)));
    paintAngle(); if(e.cancelable)e.preventDefault(); }
  function up(){ d=null; }
  el.addEventListener("mousedown",down); el.addEventListener("touchstart",down,{passive:true});
  addEventListener("mousemove",move); addEventListener("touchmove",move,{passive:false});
  addEventListener("mouseup",up); addEventListener("touchend",up);
  paintAngle();
  return paintAngle;
}
var paintTune = rotary(document.getElementById("tune"),"tuneg",
  function(){ return (freq-LO)/(HI-LO); },
  function(v){ freq=LO+v*(HI-LO); }, 0.0032);
rotary(document.getElementById("vol"),"volg",
  function(){ return vol; }, function(v){ vol=v; }, 0.006);

/* dragging the dial face itself */
(function(){
  var wrap=document.getElementById("dialwrap"), d=null;
  function down(e){ d={x:px(e),f:freq}; }
  function move(e){ if(!d)return;
    var w=wrap.getBoundingClientRect().width;
    freq=Math.max(LO,Math.min(HI, d.f-(px(e)-d.x)/w*WINDOW));
    paintTune(); if(e.cancelable)e.preventDefault(); }
  function up(){ d=null; }
  wrap.addEventListener("mousedown",down); wrap.addEventListener("touchstart",down,{passive:true});
  addEventListener("mousemove",move); addEventListener("touchmove",move,{passive:false});
  addEventListener("mouseup",up); addEventListener("touchend",up);
})();

addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){ freq=Math.min(HI,freq+0.5); paintTune(); }
  if(e.key==="ArrowLeft"){ freq=Math.max(LO,freq-0.5); paintTune(); }
  if(e.key===" "){ e.preventDefault(); togglePower(); }
});

/* ── power ──────────────────────────────────────────────────── */
var pw=document.getElementById("power"), veil=document.getElementById("veil");
var warm=0;
function togglePower(){
  power=!power; pw.classList.toggle("on",power);
  if(power){ warm=0; audioUp(); if(AC&&AC.state==="suspended")AC.resume(); click(); }
  else { click(); shown=null; win.innerHTML=""; }
}
pw.addEventListener("click",function(e){ e.stopPropagation(); togglePower(); });
veil.addEventListener("click",function(e){
  e.stopPropagation();
  if(veil.classList.contains("gone")) return;
  veil.classList.add("gone");
  if(!power) togglePower();
});

/* ── the appointed hour ─────────────────────────────────────── */
(function(){
  var lamp=document.getElementById("lamp"), txt=document.getElementById("lampTxt");
  function tick(){
    var mt=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Denver"}));
    var live = mt.getDay()===0 && mt.getHours()===22;
    lamp.classList.toggle("live",live);
    txt.textContent = live ? "on air" : "sun · 22:00 mt";
  }
  tick(); setInterval(tick,30000);
})();

/* ?on=1&f=1690 — how the set gets looked at without a hand on the knob */
(function(){
  var q=location.search;
  var f=/[?&]f=([0-9.]+)/.exec(q); if(f) freq=parseFloat(f[1]);
  if(/[?&]on=1/.test(q)){ veil.classList.add("gone"); power=true; pw.classList.add("on"); }
})();

(function knurl(){
  var g=document.getElementById("teeth"), h="";
  for(var i=0;i<44;i++){
    var a=i/44*Math.PI*2;
    h+='<line x1="'+(50+Math.cos(a)*40.5).toFixed(2)+'" y1="'+(50+Math.sin(a)*40.5).toFixed(2)
      +'" x2="'+(50+Math.cos(a)*47.5).toFixed(2)+'" y2="'+(50+Math.sin(a)*47.5).toFixed(2)+'"/>';
  }
  g.innerHTML=h;
})();

/* the case metal, generated once: fine horizontal brush plus slow blotching,
   seeded so the same set is the same set every time you switch it on */
(function caseSkin(){
  var w=420,h=300,c=document.createElement("canvas"); c.width=w; c.height=h;
  var x=c.getContext("2d"), seed=1690;
  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
  var img=x.createImageData(w,h), d=img.data;
  for(var j=0;j<h;j++){
    var row=(rnd()-0.5)*7;
    for(var i=0;i<w;i++){
      var brush=(rnd()-0.5)*11 + row;
      var blot=Math.sin(i*0.011+j*0.006)*4 + Math.sin(i*0.004-j*0.017)*3;
      var v=24+brush+blot, k=(j*w+i)*4;
      d[k]=v+3; d[k+1]=v; d[k+2]=v-3; d[k+3]=255;
    }
  }
  x.putImageData(img,0,0);
  var url=c.toDataURL();
  document.getElementById("set").style.backgroundImage="url("+url+")";
  document.querySelector(".plate").style.backgroundImage="url("+url+")";
})();

sizeAll();
setTimeout(sizeAll,120);
requestAnimationFrame(frame);
</script>
</body>
</html>
